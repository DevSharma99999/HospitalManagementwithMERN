<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border border-indigo-100">
        <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">Patient Sign In</h1>
        <p class="text-center text-gray-500 mb-8">Access your records using your registered email.</p>

        <div id="status-message" class="hidden mb-4"></div>

        <form id="patient-login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" name="email" id="email" required
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" id="password" required
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <div class="text-right">
                <a href="/patient/forgot-password" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                    Forgot password?
                </a>
            </div>

            <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                Secure Login
            </button>

            <p class="mt-6 text-center text-sm text-gray-600">
                <a href="/patient" class="font-medium text-indigo-600 hover:text-indigo-500">
                    Don't have an account? Sign Up
                </a>
            </p>
        </form>
    </div>

    <script>
        document.getElementById('patient-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('status-message');
            const formData = new FormData(e.target);
            const payload = { email: formData.get('email'), password: formData.get('password') };

            try {
                const response = await fetch('/api/patient/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                statusDiv.classList.remove('hidden');
                if (response.ok && result.success) {
                    statusDiv.className = 'p-3 rounded-md bg-green-100 text-green-700 mb-4';
                    statusDiv.textContent = result.message;
                    setTimeout(() => window.location.replace(result.redirectUrl), 1000);
                } else {
                    statusDiv.className = 'p-3 rounded-md bg-red-100 text-red-700 mb-4';
                    statusDiv.textContent = result.message || 'Login failed.';
                }
            } catch (error) {
                console.error('Login error:', error);
                statusDiv.classList.remove('hidden');
                statusDiv.className = 'p-3 rounded-md bg-red-100 text-red-700 mb-4';
                statusDiv.textContent = 'Network error during login.';
            }
        });
    </script>
</body>
</html>
