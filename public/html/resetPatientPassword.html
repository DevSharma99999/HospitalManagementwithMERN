<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border border-indigo-100">
        <h1 class="text-2xl font-bold text-gray-900 mb-2 text-center">Reset Your Password</h1>

        <div id="status-message" class="hidden mb-4"></div>

        <form id="reset-password-form" class="space-y-4">
            <input type="password" name="newPassword" required minlength="8" placeholder="New password (min 8 characters)"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
            <button type="submit"
                class="w-full py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition">
                Reset Password
            </button>
        </form>
    </div>

    <script>
        // Expects the page to be served at a route like /patient/reset-password/:token
        const pathSegments = window.location.pathname.split('/');
        const resetToken = pathSegments[pathSegments.length - 1];

        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('status-message');
            const newPassword = new FormData(e.target).get('newPassword');

            try {
                const response = await fetch('/api/patient/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, newPassword })
                });
                const result = await response.json();

                statusDiv.classList.remove('hidden');
                statusDiv.className = `p-3 rounded-md mb-4 ${result.success ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
                statusDiv.textContent = result.message;

                if (result.success && result.redirectUrl) {
                    setTimeout(() => window.location.replace(result.redirectUrl), 1500);
                }
            } catch (error) {
                statusDiv.classList.remove('hidden');
                statusDiv.className = 'p-3 rounded-md bg-red-100 text-red-700 mb-4';
                statusDiv.textContent = 'Network error.';
            }
        });
    </script>
</body>
</html>
