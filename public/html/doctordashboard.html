<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard | Set Availability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .row-card { background: #f9fafb; border: 1px solid #e5e7eb; }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-2xl border border-indigo-100">

        <header class="flex justify-between items-center mb-8 pb-4 border-b border-gray-200">
            <h1 class="text-3xl font-extrabold text-indigo-700">Manage My Schedule</h1>
            <button id="logout-button"
                class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition shadow-md">
                Logout
            </button>
        </header>

        <form id="availability-form" onsubmit="handleScheduleSubmit(event)" class="space-y-8">
            <div id="form-status-message" class="text-center font-medium"></div>

            <!-- 1. Working Hours -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xl font-semibold text-gray-800">1. Working Hours</h2>
                    <button type="button" onclick="addWorkingHourRow()"
                        class="text-sm bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-200 transition font-medium">
                        + Add Window
                    </button>
                </div>
                <p class="text-sm text-gray-500 mb-3">Add one row per working window. You can add multiple windows for the same day (e.g. morning + evening clinic).</p>
                <div id="working-hours-list" class="space-y-3"></div>
            </div>

            <!-- 2. Breaks (optional) -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xl font-semibold text-gray-800">2. Breaks <span class="text-sm font-normal text-gray-500">(optional)</span></h2>
                    <button type="button" onclick="addBreakRow()"
                        class="text-sm bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-200 transition font-medium">
                        + Add Break
                    </button>
                </div>
                <p class="text-sm text-gray-500 mb-3">E.g. lunch break — excluded from bookable slots.</p>
                <div id="breaks-list" class="space-y-3"></div>
            </div>

            <!-- 3. Slot Duration & Buffer -->
            <div>
                <h2 class="text-xl font-semibold text-gray-800 mb-3">3. Consultation Settings</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Consultation Duration (minutes)</label>
                        <input type="number" id="slotDurationMinutes" min="5" step="5" value="20" required
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Buffer Between Appointments (minutes)</label>
                        <input type="number" id="bufferMinutes" min="0" step="5" value="10" required
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </div>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold text-lg hover:bg-indigo-700 transition duration-200 shadow-xl">
                Save & Update Schedule
            </button>
        </form>

    </div>

    <script>
        const DAY_OPTIONS = [
            { value: 1, label: 'Monday' }, { value: 2, label: 'Tuesday' }, { value: 3, label: 'Wednesday' },
            { value: 4, label: 'Thursday' }, { value: 5, label: 'Friday' }, { value: 6, label: 'Saturday' },
            { value: 0, label: 'Sunday' }
        ];

        let workingHourRowCount = 0;
        let breakRowCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            fetchCurrentAvailability();
            const logoutButton = document.getElementById('logout-button');
            if (logoutButton && typeof handleLogout !== 'undefined') {
                logoutButton.addEventListener('click', handleLogout);
            }
        });

        const handleLogout = async () => {
            try {
                const response = await fetch('/logout', { method: 'POST', credentials: 'include' });
                const result = await response.json();
                if (response.ok && result.success) {
                    window.location.replace("/");
                } else {
                    alert(`Logout failed: ${result.message || 'Server error.'}`);
                }
            } catch (error) {
                console.error('Network error during logout:', error);
                alert('A network error prevented logout. Please try again.');
            }
        };

        const displayStatus = (message, isSuccess) => {
            const statusDiv = document.getElementById('form-status-message');
            if (!statusDiv) return;
            statusDiv.textContent = message;
            statusDiv.className = `p-3 rounded-md ${isSuccess ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
        };

        const dayOptionsHTML = (selectedDay) => DAY_OPTIONS.map(d =>
            `<option value="${d.value}" ${selectedDay === d.value ? 'selected' : ''}>${d.label}</option>`
        ).join('');

        function addWorkingHourRow(day = '', startTime = '09:00', endTime = '17:00') {
            const id = `wh-row-${workingHourRowCount++}`;
            const container = document.getElementById('working-hours-list');
            const row = document.createElement('div');
            row.id = id;
            row.className = 'row-card p-3 rounded-lg flex flex-wrap gap-3 items-center';
            row.innerHTML = `
                <select class="wh-day px-3 py-2 border border-gray-300 rounded-lg flex-1 min-w-[120px]">
                    ${dayOptionsHTML(day === '' ? 1 : day)}
                </select>
                <input type="time" class="wh-start px-3 py-2 border border-gray-300 rounded-lg" value="${startTime}" required>
                <span class="text-gray-400">to</span>
                <input type="time" class="wh-end px-3 py-2 border border-gray-300 rounded-lg" value="${endTime}" required>
                <button type="button" onclick="document.getElementById('${id}').remove()"
                    class="text-red-500 hover:text-red-700 px-2 font-bold">✕</button>
            `;
            container.appendChild(row);
        }

        function addBreakRow(day = '', startTime = '13:00', endTime = '13:30') {
            const id = `break-row-${breakRowCount++}`;
            const container = document.getElementById('breaks-list');
            const row = document.createElement('div');
            row.id = id;
            row.className = 'row-card p-3 rounded-lg flex flex-wrap gap-3 items-center';
            row.innerHTML = `
                <select class="break-day px-3 py-2 border border-gray-300 rounded-lg flex-1 min-w-[120px]">
                    ${dayOptionsHTML(day === '' ? 1 : day)}
                </select>
                <input type="time" class="break-start px-3 py-2 border border-gray-300 rounded-lg" value="${startTime}" required>
                <span class="text-gray-400">to</span>
                <input type="time" class="break-end px-3 py-2 border border-gray-300 rounded-lg" value="${endTime}" required>
                <button type="button" onclick="document.getElementById('${id}').remove()"
                    class="text-red-500 hover:text-red-700 px-2 font-bold">✕</button>
            `;
            container.appendChild(row);
        }

        async function fetchCurrentAvailability() {
            displayStatus('Loading current schedule...', false);
            try {
                const response = await fetch('/api/doctor/availability', { method: 'GET', credentials: 'include' });
                const result = await response.json();

                if (response.ok && result.success && result.data) {
                    const schedule = result.data;

                    document.getElementById('working-hours-list').innerHTML = '';
                    document.getElementById('breaks-list').innerHTML = '';

                    if (schedule.workingHours && schedule.workingHours.length > 0) {
                        schedule.workingHours.forEach(w => addWorkingHourRow(w.day, w.startTime, w.endTime));
                    } else {
                        addWorkingHourRow();
                    }

                    if (schedule.breaks && schedule.breaks.length > 0) {
                        schedule.breaks.forEach(b => addBreakRow(b.day, b.startTime, b.endTime));
                    }

                    document.getElementById('slotDurationMinutes').value = schedule.slotDurationMinutes || 20;
                    document.getElementById('bufferMinutes').value = schedule.bufferMinutes ?? 10;

                    displayStatus('Schedule loaded successfully. Make changes and save.', true);
                } else {
                    addWorkingHourRow();
                    displayStatus('No existing schedule found. Please set your availability.', false);
                }
            } catch (error) {
                console.error('Fetch availability error:', error);
                addWorkingHourRow();
                displayStatus('Error fetching schedule. Server might be down.', false);
            }
        }

        async function handleScheduleSubmit(event) {
            event.preventDefault();
            displayStatus('Saving schedule...', false);

            const workingHours = Array.from(document.querySelectorAll('#working-hours-list > div')).map(row => ({
                day: parseInt(row.querySelector('.wh-day').value),
                startTime: row.querySelector('.wh-start').value,
                endTime: row.querySelector('.wh-end').value
            }));

            const breaks = Array.from(document.querySelectorAll('#breaks-list > div')).map(row => ({
                day: parseInt(row.querySelector('.break-day').value),
                startTime: row.querySelector('.break-start').value,
                endTime: row.querySelector('.break-end').value
            }));

            const slotDurationMinutes = parseInt(document.getElementById('slotDurationMinutes').value);
            const bufferMinutes = parseInt(document.getElementById('bufferMinutes').value);

            if (workingHours.length === 0) {
                displayStatus('Please add at least one working hour window.', false);
                return;
            }

            const invalidRow = workingHours.find(w => w.startTime >= w.endTime) ||
                                breaks.find(b => b.startTime >= b.endTime);
            if (invalidRow) {
                displayStatus('Each window\'s start time must be before its end time.', false);
                return;
            }

            try {
                const response = await fetch('/api/doctor/availability', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ workingHours, breaks, slotDurationMinutes, bufferMinutes }),
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    displayStatus(result.message, true);
                    if (result.redirectUrl) {
                        setTimeout(() => window.location.replace(result.redirectUrl), 1500);
                    }
                } else {
                    displayStatus(`Failed to save: ${result.message || 'Server error.'}`, false);
                }
            } catch (error) {
                console.error('Submission error:', error);
                displayStatus('Network error during submission.', false);
            }
        }
    </script>
</body>

</html>
